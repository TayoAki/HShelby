# CI for the published repository (github.com/tayoaki/hireshelby-ios). In Hire Shelby's main repository this
# folder is sdk/ios and .github/workflows/ios-sdk.yml runs the same checks.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -n 1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
      - run: swift build
      - run: swift test
      - run: xcodebuild -scheme HireShelby -destination 'generic/platform=iOS Simulator' build
      - run: xcodebuild -scheme HireShelby -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build
